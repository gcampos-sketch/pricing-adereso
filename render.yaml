# Initial deployment uses the free plan; approve a paid plan separately when needed.
services:
  - type: web
    name: adereso-hub-comercial
    runtime: docker
    repo: https://github.com/gcampos-sketch/pricing-adereso
    branch: codex/dashboard-sales-hub
    plan: free
    region: virginia
    dockerfilePath: ./dashboard-sales/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - dashboard-sales/**
        - render.yaml
        - roi-standalone.js
        - roi-share.js
        - wallet-standalone.js
        - wallet-share.js
        - index.html
        - brand-system.css
        - chapter-index.js
        - dashboard-settings.js
        - assets/**
        - academy/**
        - argumentaciones/**
        - operativa/**
        - playbook/**
        - dashboard/**
        - "*.webp"
        - .dockerignore
    envVars:
      - key: PORT
        value: 10000
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_SUPABASE_PROJECT_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # Public presentation on the CDN: no sleeping server and no private environment variables.
  - type: web
    name: adereso-partners
    runtime: static
    repo: https://github.com/gcampos-sketch/pricing-adereso
    branch: codex/dashboard-sales-hub
    buildCommand: node --experimental-strip-types scripts/build-partners.mjs
    staticPublishPath: ./partners-public
    autoDeployTrigger: checksPass
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
    buildFilter:
      paths:
        - roi-standalone.js
        - index.html
        - brand-system.css
        - chapter-index.js
        - logoadereso.webp
        - dashboard-sales/src/lib/partner-public.ts
        - dashboard-sales/src/lib/roi-public.ts
        - scripts/build-partners.mjs
        - render.yaml
