# Initial deployment uses the free plan; approve a paid plan separately when needed.
services:
  - type: web
    name: adereso-sales-dashboard
    runtime: docker
    repo: https://github.com/gcampos-sketch/pricing-adereso
    branch: codex/dashboard-sales-hub
    plan: free
    region: virginia
    dockerfilePath: ./dashboard-sales/Dockerfile
    dockerContext: ./dashboard-sales
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - dashboard-sales/**
        - render.yaml
    envVars:
      - key: PORT
        value: 10000
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_SUPABASE_PROJECT_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: HUBSPOT_ACCESS_TOKEN
        sync: false
